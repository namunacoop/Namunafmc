<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>दूध अनुदान वितरण कार्यक्रम - मनहरी गाउँपालिका</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Mukta', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #1c3b57 100%);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 3D Glassmorphism Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), 
                        inset 0 0 15px rgba(255, 255, 255, 0.5);
            border-radius: 24px;
        }

        /* Moving Cows Animation in Background */
        .cow-animation-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 180px;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .walking-cow-1 {
            position: absolute;
            bottom: 10px;
            font-size: 80px;
            animation: walkRight 22s linear infinite;
            filter: drop-shadow(0 10px 8px rgba(0,0,0,0.4));
        }

        .walking-cow-2 {
            position: absolute;
            bottom: 25px;
            font-size: 60px;
            animation: walkRight 32s linear infinite;
            animation-delay: -10s;
            opacity: 0.85;
            filter: drop-shadow(0 8px 6px rgba(0,0,0,0.3));
        }

        .walking-cow-3 {
            position: absolute;
            bottom: 5px;
            font-size: 95px;
            animation: walkRight 18s linear infinite;
            animation-delay: -5s;
            filter: drop-shadow(0 12px 10px rgba(0,0,0,0.5));
        }

        @keyframes walkRight {
            0% { left: -150px; transform: scaleX(1); }
            100% { left: 105vw; transform: scaleX(1); }
        }

        /* Floating Milk Cans Animation */
        .milk-can-floating {
            animation: floatCan 4s ease-in-out infinite alternate;
        }

        @keyframes floatCan {
            0% { transform: translateY(0px) rotate(-3deg); }
            100% { transform: translateY(-18px) rotate(3deg); }
        }

        /* Glowing text effects */
        .glow-title {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 40px rgba(255, 215, 0, 0.6);
        }

        .glow-badge {
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.8);
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(234, 179, 8, 0.6); }
            100% { transform: scale(1.05); box-shadow: 0 0 35px rgba(234, 179, 8, 1); }
        }

        /* Custom Splash Wave */
        .wave-bg {
            background: linear-gradient(0deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 100%);
        }
    </style>
</head>
<body class="text-gray-900 pb-24 relative">

    <!-- Background Floating Milk Cans Elements -->
    <div class="fixed top-12 left-6 text-white/20 text-8xl milk-can-floating pointer-events-none z-0">
        <i class="fa-solid fa-bottle-droplet"></i>
    </div>
    <div class="fixed top-1/3 right-8 text-white/15 text-9xl milk-can-floating pointer-events-none z-0" style="animation-delay: -2s;">
        <i class="fa-solid fa-cow"></i>
    </div>
    <div class="fixed bottom-1/4 left-10 text-white/20 text-8xl milk-can-floating pointer-events-none z-0" style="animation-delay: -1s;">
        <i class="fa-solid fa-whisky-glass"></i>
    </div>

    <div class="container mx-auto px-4 py-8 relative z-10">
        
        <!-- Top Header Banner -->
        <header class="text-center mb-8">
            <div class="inline-flex items-center gap-3 bg-red-600 text-white px-8 py-3 rounded-full font-bold text-2xl shadow-2xl mb-4 border-2 border-white/40">
                <i class="fa-solid fa-map-marker-alt text-yellow-300"></i>
                <span>नमुना कृषक बहुमुखी सहकारी स‌स्था लि</span>
            </div>
            <h1 class="text-5xl md:text-7xl font-extrabold text-white tracking-wide glow-title mt-2 leading-tight">
                दुग्ध उत्पादक किसानहरुलाइ प्रोत्साहन बितरण कार्यक्रम
            </h1>
            <p class="text-2xl md:text-3xl text-yellow-300 font-bold mt-2 shadow-sm">
                आर्थिक सहयोग: मनहरी गाँउपालिका
            </p>
        </header>

        <!-- Highlight Subsidy Rate Banner (Width Increased by 50%) -->
        <div class="max-w-6xl mx-auto mb-10">
            <div class="bg-gradient-to-r from-yellow-500 via-amber-400 to-yellow-500 rounded-3xl p-6 md:p-8 text-center text-gray-900 font-extrabold shadow-2xl border-4 border-white glow-badge transform transition hover:scale-105">
                <div class="text-3xl md:text-4xl text-gray-900 mb-1">दुध उत्पादनमा आधारीत अनुदान कार्यक्रम </div>
                <div class="text-6xl md:text-8xl font-black text-red-700 tracking-wider my-2">
                    रु. ३ /- <span class="text-3xl md:text-5xl text-gray-900">प्रति लिटर</span>
                </div>
            </div>
        </div>

        <!-- Palika Stats Overview -->
        <div class="mt-8 grid grid-cols-1 md:grid-cols-3 gap-6 max-w-6xl mx-auto">
            <div class="glass-card p-6 text-center transform hover:-translate-y-2 transition duration-300">
                <div class="text-5xl text-blue-600 mb-2"><i class="fa-solid fa-users"></i></div>
                <div class="text-4xl font-black text-gray-800">१७२+</div>
                <div class="text-2xl font-bold text-gray-600">लाभान्वित कृषकहरू</div>
            </div>
            <div class="glass-card p-6 text-center transform hover:-translate-y-2 transition duration-300">
                <div class="text-5xl text-emerald-600 mb-2"><i class="fa-solid fa-glass-water-droplet"></i></div>
                <div class="text-4xl font-black text-gray-800">३७०८३०।१०</div>
                <div class="text-2xl font-bold text-gray-600">वार्षिक उत्पादन लिटर</div>
            </div>
            <div class="glass-card p-6 text-center transform hover:-translate-y-2 transition duration-300">
                <div class="text-5xl text-amber-500 mb-2"><i class="fa-solid fa-coins"></i></div>
                <div class="text-4xl font-black text-gray-800">रु. १११२४९०।३०</div>
                <div class="text-2xl font-bold text-gray-600">वार्षिक अनुदान रकम</div>
            </div>
        </div>
    </div>

    <!-- Walking Cows Background Animation Layer -->
    <div class="cow-animation-container">
        <!-- Walking Cow 1 -->
        <div class="walking-cow-1" title="मनहरी गाई">
            🐄
        </div>
        <!-- Walking Cow 2 -->
        <div class="walking-cow-2" title="दुग्ध विकास">
            🐄
        </div>
        <!-- Walking Cow 3 -->
        <div class="walking-cow-3" title="उन्नत गाई पालन">
            🐄
        </div>
    </div>

    <script>
        // Update Live Slider Output
        const milkSlider = document.getElementById('milkLiters');
        const literDisplay = document.getElementById('literDisplay');

        if(milkSlider) {
            milkSlider.addEventListener('input', function() {
                const val = this.value;
                literDisplay.textContent = Number(val).toLocaleString('ne-NP') + ' लिटर';
                calculateGrant();
            });
        }

        // Function to Calculate and Display Grant Amount
        function calculateGrant() {
            const nameInput = document.getElementById('farmerName');
            const wardInput = document.getElementById('wardNo');
            if(!nameInput || !wardInput || !milkSlider) return;

            const name = nameInput.value || 'कृषक';
            const ward = wardInput.value;
            const liters = parseInt(milkSlider.value) || 0;
            const totalAmount = liters * 3;

            // Nepali Number Formatter Helper
            const nepaliDigits = ['०','१','२','३','४','५','६','७','८','९'];
            function toNepaliNum(num) {
                return num.toString().replace(/\d/g, d => nepaliDigits[d]);
            }

            // Update UI elements
            document.getElementById('resName').textContent = name;
            document.getElementById('resWard').textContent = 'मनहरी, वडा नं. ' + toNepaliNum(ward);
            document.getElementById('resMilk').textContent = toNepaliNum(liters.toLocaleString('en-US')) + ' लिटर';
            document.getElementById('resTotal').textContent = 'रु. ' + toNepaliNum(totalAmount.toLocaleString('en-US')) + '/-';
        }

        // Initial trigger on load
        window.onload = function() {
            calculateGrant();
        };
    </script>
</body>
</html>
